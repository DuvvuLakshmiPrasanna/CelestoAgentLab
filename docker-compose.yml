# One command: `docker-compose up --build`  (or `docker compose up --build`)
#
# Two services form the trusted control plane:
#   ledger  Postgres; ./seeds is loaded on first boot, no manual migration
#   api     the run-ledger HTTP API on :8080
#
# Celesto computers (Firecracker microVMs) are NOT Compose services. The api and the
# agent create them through the Celesto SDK/CLI. With no KVM and no cloud key this stack
# still becomes healthy and still serves the shipped reports.
name: celesto-sandbox-grader

services:
  ledger:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    volumes:
      - ./seeds:/docker-entrypoint-initdb.d:ro
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ledger:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgresql://ledger:ledger@ledger:5432/ledger
      CELESTO_PROVIDER: ${CELESTO_PROVIDER:-cloud}
      CELESTO_API_KEY: ${CELESTO_API_KEY:-replace-me}
      CELESTO_BACKEND: ${CELESTO_BACKEND:-firecracker}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://example-llm-host/v1}
      LLM_API_KEY: ${LLM_API_KEY:-replace-me}
      LLM_MODEL: ${LLM_MODEL:-replace-with-a-model-name}
      REPORTS_DIR: /app/reports
      LOGS_DIR: /app/logs
    volumes:
      - ./reports:/app/reports:ro
      - ./logs:/app/logs:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  ledger_data:
